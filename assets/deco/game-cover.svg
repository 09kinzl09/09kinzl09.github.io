<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="王子救人之旅封面">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset="0.55" stop-color="#f3fbf6"/>
      <stop offset="1" stop-color="#eef8f1"/>
    </linearGradient>
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6cc"/>
      <stop offset="1" stop-color="#9ed8b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- 远处城堡 -->
  <g fill="#dcecf3" opacity="0.9">
    <rect x="392" y="120" width="26" height="120" rx="4"/>
    <rect x="428" y="96" width="34" height="144" rx="4"/>
    <rect x="472" y="132" width="24" height="108" rx="4"/>
    <path d="M428 96 l17 -26 l17 26 z" fill="#cfe2ec"/>
    <path d="M392 120 l13 -20 l13 20 z" fill="#cfe2ec"/>
    <path d="M472 132 l12 -18 l12 18 z" fill="#cfe2ec"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="256" width="640" height="104" fill="url(#grassG)"/>
  <path d="M0 258 q80 -12 160 0 t160 0 t160 0 t160 0 v102 H0 z" fill="#a9dcbb" opacity="0.55"/>

  <!-- 草丛 -->
  <g stroke="#6fbf8e" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M60 300 q4 -22 12 -32"/>
    <path d="M78 302 q-4 -20 -14 -30"/>
    <path d="M120 306 q6 -24 14 -34"/>
    <path d="M540 302 q-6 -22 -14 -32"/>
    <path d="M562 304 q6 -20 14 -30"/>
  </g>

  <!-- 光晕 -->
  <circle cx="330" cy="196" r="96" fill="url(#glow)"/>

  <!-- 笼子里的张子龙 -->
  <g>
    <rect x="296" y="168" width="72" height="84" rx="8" fill="#f7fbf9" opacity="0.85"/>
    <g>
      <circle cx="332" cy="196" r="13" fill="#fbe0c3"/>
      <path d="M319 192 a13 13 0 0 1 26 0 q-13 -8 -26 0 z" fill="#4b3b31"/>
      <rect x="320" y="209" width="24" height="26" rx="8" fill="#8ec9f5"/>
      <circle cx="327" cy="196" r="1.8" fill="#4b3b31"/>
      <circle cx="337" cy="196" r="1.8" fill="#4b3b31"/>
      <path d="M326 203 q6 6 12 0" stroke="#4b3b31" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>
    <g stroke="#7f8f9d" stroke-width="4" stroke-linecap="round">
      <path d="M300 170 v82 M316 170 v82 M332 170 v82 M348 170 v82 M364 170 v82"/>
      <path d="M296 168 h72 M296 252 h72"/>
    </g>
    <text x="332" y="146" text-anchor="middle" font-size="13" fill="#c2557a" font-weight="bold">救我…</text>
  </g>

  <!-- 王子田育瑄 -->
  <g>
    <ellipse cx="170" cy="292" rx="24" ry="6" fill="#8fc7a4" opacity="0.5"/>
    <path d="M146 288 q-10 -6 -14 -18 q14 4 18 14 z" fill="#2f9ff2"/>
    <rect x="152" y="238" width="36" height="48" rx="12" fill="#6fc3a1"/>
    <circle cx="170" cy="222" r="17" fill="#fbe0c3"/>
    <path d="M153 218 a17 17 0 0 1 34 0 q-17 -10 -34 0 z" fill="#4b3b31"/>
    <circle cx="153" cy="224" r="6" fill="#4b3b31"/>
    <path d="M158 204 l5 -11 l6 9 l6 -9 l5 11 z" fill="#ffd166"/>
    <circle cx="164" cy="224" r="2.4" fill="#4b3b31"/>
    <circle cx="176" cy="224" r="2.4" fill="#4b3b31"/>
    <path d="M164 231 q6 6 12 0" stroke="#4b3b31" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 手里的爱心 -->
    <path d="M208 236 c-6 -7 -17 -3 -17 6 c0 8 11 13 17 19 c6 -6 17 -11 17 -19 c0 -9 -11 -13 -17 -6 z" fill="#ff8fa3"/>
  </g>

  <!-- 士兵 -->
  <g>
    <ellipse cx="246" cy="290" rx="20" ry="5" fill="#8fc7a4" opacity="0.45"/>
    <rect x="234" y="244" width="26" height="40" rx="10" fill="#9aa7b4"/>
    <circle cx="247" cy="232" r="13" fill="#fbe0c3"/>
    <path d="M234 229 a13 13 0 0 1 26 0 z" fill="#c2557a"/>
    <rect x="233" y="227" width="28" height="5" rx="2.5" fill="#c2557a"/>
    <path d="M264 240 q12 10 0 20" stroke="#8a6a45" stroke-width="3" fill="none"/>
    <path d="M266 250 h14" stroke="#8a6a45" stroke-width="2.4"/>
    <path d="M284 250 l-6 -3.4 v6.8 z" fill="#8a6a45"/>
  </g>

  <!-- 另一名士兵 -->
  <g opacity="0.95">
    <ellipse cx="424" cy="292" rx="20" ry="5" fill="#8fc7a4" opacity="0.45"/>
    <rect x="412" y="248" width="26" height="40" rx="10" fill="#9aa7b4"/>
    <circle cx="425" cy="236" r="13" fill="#fbe0c3"/>
    <path d="M412 233 a13 13 0 0 1 26 0 z" fill="#c2557a"/>
    <rect x="411" y="231" width="28" height="5" rx="2.5" fill="#c2557a"/>
    <path d="M404 244 q-12 10 0 20" stroke="#8a6a45" stroke-width="3" fill="none"/>
    <path d="M386 254 h14" stroke="#8a6a45" stroke-width="2.4"/>
    <path d="M378 254 l6 -3.4 v6.8 z" fill="#8a6a45"/>
  </g>

  <!-- 飘着的爱心 -->
  <g fill="#ffb7cd" opacity="0.9">
    <path d="M300 108 c-4 -5 -12 -2 -12 4 c0 6 8 9 12 13 c4 -4 12 -7 12 -13 c0 -6 -8 -9 -12 -4 z"/>
    <path d="M368 128 c-3 -4 -9 -2 -9 3 c0 4 6 7 9 10 c3 -3 9 -6 9 -10 c0 -5 -6 -7 -9 -3 z" opacity="0.7"/>
  </g>

  <!-- 标题 -->
  <text x="26" y="66" font-family="KaiTi, STKaiti, 'Songti SC', serif" font-size="38" font-weight="bold" fill="#1e2f3e">王子救人之旅</text>
  <text x="28" y="96" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" fill="#61788a" letter-spacing="2">田育瑄 × 张子龙　·　躲开箭，走到笼子那边</text>

  <!-- 血量示意 -->
  <g>
    <path d="M28 320 c-6 -7 -17 -3 -17 6 c0 8 11 13 17 19 c6 -6 17 -11 17 -19 c0 -9 -11 -13 -17 -6 z" fill="#ff6f88"/>
    <path d="M60 320 c-6 -7 -17 -3 -17 6 c0 8 11 13 17 19 c6 -6 17 -11 17 -19 c0 -9 -11 -13 -17 -6 z" fill="#ff6f88"/>
    <path d="M92 320 c-6 -7 -17 -3 -17 6 c0 8 11 13 17 19 c6 -6 17 -11 17 -19 c0 -9 -11 -13 -17 -6 z" fill="#ff6f88"/>
    <path d="M124 320 c-6 -7 -17 -3 -17 6 c0 8 11 13 17 19 c6 -6 17 -11 17 -19 c0 -9 -11 -13 -17 -6 z" fill="rgba(255,255,255,0.65)" stroke="#ffb0be" stroke-width="2"/>
    <path d="M156 320 c-6 -7 -17 -3 -17 6 c0 8 11 13 17 19 c6 -6 17 -11 17 -19 c0 -9 -11 -13 -17 -6 z" fill="rgba(255,255,255,0.65)" stroke="#ffb0be" stroke-width="2"/>
  </g>
</svg>
